
<!DOCTYPE html>
<html>
<head>
<title>Promise Lab</title>

<style>
* { box-sizing:border-box; }

body {
    margin:0;
    background:linear-gradient(135deg,#080b20,#17113b,#071c35);
    color:white;
    font-family:Arial;
    min-height:100vh;
    display:grid;
    place-items:center;
}

.card {
    width:90%;
    max-width:600px;
    padding:35px 20px;
    text-align:center;
    background:#ffffff0d;
    border:1px solid #7165ff66;
    border-radius:22px;
    box-shadow:0 0 35px #5145cd44;
}

h1 {
    color:#66e6ff;
    text-shadow:0 0 15px #00bfff;
}

p { color:#aaa; }

button {
    padding:13px 17px;
    margin:7px;
    border:1px solid #55dfff;
    border-radius:10px;
    background:#172b53;
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover {
    background:#00bfff;
    color:#071326;
    box-shadow:0 0 20px #00bfff;
    transform:translateY(-4px);
}

#result {
    margin-top:30px;
    padding:25px;
    background:#090f25;
    border-radius:12px;
    color:#64eaff;
    min-height:65px;
}

#toast {
    position:fixed;
    bottom:25px;
    background:#00cba9;
    color:#071326;
    padding:15px 25px;
    border-radius:10px;
    opacity:0;
    transition:.4s;
}

#toast.show { opacity:1; }
</style>
</head>

<body>

<div class="card">

<h1>⚡ PROMISE LAB</h1>
<p>JavaScript Asynchronous Playground</p>

<button onclick="runPromise()">Promise</button>
<button onclick="runChain()">Chaining</button>
<button onclick="runAsync()">Async Await</button>

<div id="result">Choose Your Experiment...</div>

</div>

<div id="toast"></div>

<script>
const result = document.getElementById("result");
const toast = document.getElementById("toast");

function notify(msg) {
    toast.innerText = msg;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}

function delay() {
    return new Promise(resolve =>
        setTimeout(resolve, 3000)
    );
}

function runPromise() {
    result.innerText = "⚡ Processing...";
    delay().then(() => {
        result.innerText = "✓ Promise Completed!";
        notify("Promise Success!");
    });
}

function runChain() {
    result.innerText = "⚡ Starting...";
    delay()
    .then(() => "Step 1 Completed")
    .then(msg => msg + " → Step 2 Completed")
    .then(msg => {
        result.innerText = msg;
        notify("Chaining Success!");
    });
}

async function runAsync() {
    result.innerText = "⚡ Loading...";
    await delay();
    result.innerText = "✓ Async Await Completed!";
    notify("Async Success!");
}
</script>

</body>
</html>
